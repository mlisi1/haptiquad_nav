# global_planner.yaml
# Using navfn (Dijkstra/A*) on the all-free global costmap.
# Since the map is free, plans will be straight lines to goal.

allow_unknown: true             # navigate in unmapped areas
default_tolerance: 0.2          # [m] goal tolerance for planner
visualize_potential: false

# Alternatively use GlobalPlanner (more configurable):
# use_dijkstra: true
# use_quadratic: true
# use_grid_path: false
# old_navfn_behavior: false
