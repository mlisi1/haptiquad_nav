# costmap_common.yaml
# Shared by both global_costmap and local_costmap

robot_base_frame: base
map_frame: map
transform_tolerance: 0.5      # [s] allow TF lookups up to 0.5s stale (localization_manager has ~8ms latency)

# ANYmal C body from URDF collision box: 1.05 × 0.50 m.
# Using the actual polygon gives accurate collision checking (inscribed r=0.25 m,
# circumscribed r≈0.58 m) and lets the robot thread narrower gaps than the old
# 0.55 m circle allowed in the lateral direction.
footprint: [[0.525, 0.25], [-0.525, 0.25], [-0.525, -0.25], [0.525, -0.25]]
footprint_padding: 0.02       # [m] small safety margin added to polygon

# ── Inflation layer ───────────────────────────────────────────────
inflation_layer:
  enabled: true
  inflation_radius: 0.80         # [m] clearance buffer around lethal cells
  cost_scaling_factor: 3.0       # higher = steeper cost dropoff from obstacle
