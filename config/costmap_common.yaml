# costmap_common.yaml
# Shared by both global_costmap and local_costmap

robot_base_frame: base
map_frame: map
transform_tolerance: 0.5      # [s] allow TF lookups up to 0.5s stale (localization_manager has ~8ms latency)

robot_radius: 0.55            # circumscribed radius [m] — ANYmal C body half-width
                              # 0.75 m was tried but caused lethal-zone overlap between
                              # adjacent cubes (1.0 m face-to-face gap), leaving no valid
                              # NavFnROS start position after backup — robot spun in place.

# ── Inflation layer ───────────────────────────────────────────────
inflation_layer:
  enabled: true
  inflation_radius: 0.80         # [m] clearance buffer around lethal cells
  cost_scaling_factor: 3.0       # higher = steeper cost dropoff from obstacle
