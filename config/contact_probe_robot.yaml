# contact_probe_robot.yaml -- loaded AFTER contact_probe.yaml when
# navigation.launch platform:=robot. Only what differs from simulation.
#
# NOT yet validated on hardware. Before relying on the classifier:
#   - measure the wrench noise floor standing and walking, and the
#     /estimated_forces rate (the calibration log line prints the rate);
#   - re-derive contact_force_threshold_n and classification_force_threshold_n
#     (both come from Gazebo sweeps with a generic URDF and no joint friction);
#   - check the lidar height band and self_filter_box against real returns
#     (rviz: /lidar/point_cloud with the base frame).

# Average the standing wrench for this long after startup (robot already in
# walk mode, no goal accepted meanwhile) and subtract it -- real drive
# friction / model error show up as a constant base-wrench offset. It is
# constant in BASE frame (~(-7.7,-3.1)N on chamois, 2026-11-04 bags), so it
# is stored there and rotated with the current yaw.
wrench_bias_calibration_s: 5.0
max_wrench_bias_n: 40.0
# Filter window in time rather than samples: the sample count follows the
# rate measured during calibration (~125ms, what 50 samples were at 400Hz).
wrench_filter_window_s: 0.125

# Lidar: heights along gravity (not the tilting base z axis), from ~0.10m
# above the ground (base nominally ~0.55m high) so low obstacles are seen.
# Leg/foot returns near the ground are removed by the body box instead.
cloud_height_reference: gravity
cloud_height_min: -0.45
# [x_min, x_max, y_min, y_max] base frame: body + feet at full stride. Every
# distance trigger must lie OUTSIDE it, or the obstacle vanishes from the
# cloud exactly when it matters (probe_distance, backup_min_clearance > 0.55).
self_filter_box: [-0.55, 0.55, -0.35, 0.35]
# The robot brakes at ~0.5-0.8 m/s^2 (2026-11-05 bags): from 0.6 m/s to
# 0.15 m/s takes ~0.35 m plus ~0.1 m of command latency, and the box face is
# ~0.55 m from base at contact, so slow down from 1.20 m (0.90 m would still
# hit at ~0.3 m/s; in simulation contact came at 0.35-0.70 m/s).
slow_approach_distance: 1.20
# Lidar distance to the box jittered 1.18-1.31 m at the threshold (2026-11-05
# run 4) and toggled SLOW_APPROACH/NORMAL_NAV up to 3 times a second.
slow_approach_exit_margin: 0.25
probe_distance: 0.70
backup_min_clearance: 0.70

# Contact speed on hardware: manual pushes at 0.05-0.19 m/s already peaked at
# 149-168N on the front face. With classification_decision: event a slow probe
# only costs ~1 s. Keep probe_speed <= slow_approach_speed, or the robot speeds
# up again inside probe_distance.
slow_approach_speed: 0.15
probe_speed: 0.12

# Reversing away from the contact; the rear is covered by the lidar sector
# check (backup_min_clearance).
backup_speed: 0.30

# Unexpected contact outside probing halts the robot.
collision_stop_enabled: true
# Walking at 0.4-0.6 m/s peaked at 27.8N (2026-11-05 baseline bag, correct
# bias): 30N left 2N of margin.
collision_force_threshold_n: 40.0
collision_hold_time: 0.3

# At slow approach speeds the contact force is still rising through a fixed
# classify window (2026-11-05: same box 59-96N at 0.05-0.11 m/s, 118N at
# 0.19 m/s), so decide on events instead -- see contact_probe.yaml.
classification_decision: event

# Hardware reference pushes (2026-11-05 run 3, ~0.12 m/s): a 27 kg box sliding
# on wood peaked at 101-111N (0.4 s mean, breakaway) and slid at 75-94N; a wall
# plateaued at 152-159N (push limit). 130N sits ~20N from both. Tall objects
# that tip at 115-130N (same box on the bare floor) come out MOVABLE.
classification_force_threshold_n: 130.0

# First autonomous runs: cruise at half the planner's max_vel_x (0.6 -> 0.3 m/s).
# This is also the speed a MOVABLE object is pushed at after classification.
normal_speed_fraction: 0.5

# Taking over with the radio joystick during a mission aborts it (goal
# cancelled, not replayed, logged on /haptiquad_nav/mission_event); between
# missions the joystick is ignored. Check the topic on the robot:
#   rostopic info /joy_manager/twist
operator_override_enabled: true
# 2026-11-05 run 5: a relaunched stack next to the box started probing on its
# own (CONTACT_PROBE sent a probe goal with no user goal set), and a box still
# remembered as MOVABLE from an earlier mission was hit at cruise speed.
probe_only_in_mission: true          # no SLOW_APPROACH/CONTACT_PROBE without a user goal
cancel_unowned_goals: true           # cancel move_base goals no mission owns
forget_obstacles_on_new_goal: true   # objects are rearranged between trials
