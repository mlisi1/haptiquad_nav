# contact_probe.yaml
# Parameters for the contact_probe_manager state machine node.

# ── Contact detection threshold ────────────────────────────────────
# Forces in [N]. A SINGLE threshold on the force projected onto the
# approach heading (fx, fy rotated into the direction the robot was facing
# at CONTACT_PROBE entry -- see contact_probe_manager.py's
# _wrench_forward_mag), not two independent per-axis thresholds. fz and
# the torque axes (tx/ty/tz) are excluded entirely -- dominated by
# walking-gait dynamics rather than genuine object contact (ANYmal's
# vertical/roll/pitch base wrench swings well past what a light contact
# produces just from normal walking). Including them caused both false
# CONTACT_PROBE triggers from gait noise and a SOLID bias in force-mode
# classification (the noisy fz component swamped the w_now/w_init drop
# ratio).
#
# A single threshold on the projected magnitude is isotropic: the same
# resultant force triggers detection regardless of approach heading. The
# previous two-threshold (fx, fy independently) scheme was anisotropic --
# at a 45 degree approach heading it required up to threshold*sqrt(2) of
# resultant force to trigger (neither raw axis component alone reached the
# threshold), while a 0/90 degree heading only needed the threshold itself.
# All three haptiquad_nav_eval sweeps currently fix approach_angle at 0, so
# this value carries over unchanged from the old fx/fy pair (both were
# already equal at 12N) -- re-validate before trusting this default at any
# other approach heading. 7N was briefly tried (test_timing_opt_5rep_8N);
# every other recorded sweep ran at 12N, so 12N stays the reference value.
#
# Lowered from 20N: test_sweep_force_6 showed 1kg objects (all mu tested)
# visually moving but never registering CONTACT_PROBE->CLASSIFYING at all
# (NO_CONTACT) -- fx/fy never sustained above 20N for the full
# contact_hold_time even though contact clearly happened. 12N sits in the
# ~10-15N range this comment already called out, above the ~5-8N gait
# noise floor. Watch for the same NO_CONTACT pattern reappearing at very
# low mass/mu combos -- if it does, contact_hold_time (not just this
# threshold) may need shortening too, since a very light/low-friction
# object can accelerate away before 1.0s of sustained force accumulates.
contact_force_threshold_n: 12.0

# Averaging window for wrench (reduces noise spikes)
# ANYmal gait ≈ 2 Hz; wrench publishes at ~400 Hz → 200 samples ≈ one gait cycle.
# 50 samples gives ~125 ms smoothing — enough to suppress most gait oscillations
# without adding too much detection latency.
wrench_filter_window: 50        # samples

# ── Speed profiles ────────────────────────────────────────────────
normal_speed_fraction: 1.0      # fraction of max_vel_x in NORMAL_NAV
slow_approach_speed: 0.30       # [m/s] absolute, in SLOW_APPROACH state
probe_speed: 0.3              # [m/s] absolute, in CONTACT_PROBE state
                               # 0.1 m/s was too slow to push 5 kg / mu=0.05 boxes (~2.5 N friction)

# ── Distance triggers ─────────────────────────────────────────────
# Distance to nearest point in the forward ±45° sector (from 3D cloud).
slow_approach_distance: 0.7     # [m] NORMAL_NAV → SLOW_APPROACH
                                # Must be > probe_distance (0.65 m) > cloud_range_min (0.55 m).
                                # Lowered from 1.0 m to shorten the slow approach phase.
probe_distance: 0.65            # [m] SLOW_APPROACH → CONTACT_PROBE
                                # Must be > cloud_range_min (0.55 m).
                                # Robot front ≈ 0.275 m ahead of base → at 0.65 m
                                # the front is ~0.375 m from the obstacle surface.

# Only enter CONTACT_PROBE if the nearest obstacle is within this angle of the
# robot's heading (base frame).  Prevents probing when the robot passes laterally
# through a slow-approach zone without actually heading into the obstacle.
probe_heading_max_deg: 25.0     # [deg] half-angle; tighten to reduce false triggers

# How far past the detected obstacle face to place the probe goal.
# Ensures the carrot planner drives the robot into the object so movable obstacles
# actually get pushed.  goal_dist = obs_dist + probe_push_depth.
probe_push_depth: 0.7           # [m]

# ── Map update ────────────────────────────────────────────────────
mark_radius: 0.15                # [m] radius used by the provisional-ring fallback
# Assumed obstacle depth extruded behind the measured front face.
# The front face width is measured from the lidar; this depth synthesises the
# sides so the costmap rectangle covers the full obstacle footprint.
# Set to the largest obstacle depth you expect to encounter (m).
obstacle_assumed_depth: 0.5     # [m] test-world cubes are 0.5 m deep

# Radius (m) around a confirmed solid's contact point within which
# _refine_last_solid() collects lidar points to measure the front face width.
# Must exceed half the widest obstacle's lateral extent + margin, or a long
# obstacle's mark will be narrower than its true footprint. Sized for the
# ~0.5m test-world cubes by default; haptiquad_nav_eval's timing sweep
# overrides this live per-trial via ~solid_refine_capture_radius_override for
# its lateral-length sweep (see haptiquad_nav_eval/config/timing_sweep.yaml).
solid_refine_capture_radius: 0.75   # [m]

# ── Timing ────────────────────────────────────────────────────────
probe_timeout: 20.0             # [s] max time in CONTACT_PROBE before giving up
                                # Suspended once wrench exceeds threshold.
contact_hold_time: 1.0          # [s] wrench must exceed threshold for this long
classify_time: 0.6              # [s] forward push duration during classification

# ── Classification criterion (ablation toggle) ─────────────────────
# Which signal decides MOVABLE vs SOLID once the classify_time window closes.
# Both metrics are always computed and logged regardless of mode -- only the
# selected one drives the decision. Override via navigation.launch's
# classification_mode arg for a single run; the value here is the default.
#   force        : (default) MOVABLE iff the settled forward-push force stays
#                  below classification_force_threshold_n. Chosen over a
#                  relative-drop criterion because a continuously-pushed
#                  sliding object exerts a roughly CONSTANT force under
#                  Coulomb friction (~mu*m*g) -- it doesn't decay over time,
#                  so "did force drop" can't tell steady sliding apart from
#                  genuinely stuck (confirmed empirically: test_sweep_force_5
#                  classified 28/32 SOLID, 0/32 MOVABLE using the old
#                  relative-drop criterion across the whole mass/mu sweep).
#   displacement : MOVABLE iff the base kept translating forward through the
#                  object during classify_time (kinematic criterion).
classification_mode: force
# 'force' mode only. Settled-force sampling starts this many seconds into
# CLASSIFYING (skips the initial contact transient / static-friction breakaway).
classification_force_settle_time: 0.2
# 'force' mode only. MOVABLE iff the mean settled forward force stays below
# this. Empirically derived (see FORCE_SATURATION_THRESHOLD.md at the repo
# root) -- not an a priori fraction of robot weight. For obstacles beyond the
# robot's push capability, the settled force saturates at a mass/friction-
# independent ~121-157N band (the robot's own actuation/gait limit bouncing
# against a rigid constraint, not a measurement of the obstacle), while
# genuinely sliding obstacles stay at 18-85N -- a clean, empty gap in
# between (test_sweep_force_10, m in [5,70]kg, mu in [0.1,0.8]). 100N sits
# in that gap with margin on both sides. Re-derive if probe_speed, gait, or
# the robot model changes -- the saturation ceiling is a property of those,
# not a universal constant.
classification_force_threshold_n: 100.0

# ── Back-up after SOLID detection ─────────────────────────────────
# After classifying an obstacle as SOLID, the robot reverses briefly so
# move_base has enough clearance to plan a path around the obstacle.
# backup_clearance = robot_radius + inflation_radius + backup_extra_margin
#   = 0.55 + 0.80 + 0.25 = 1.60 m
# This guarantees the robot centre is outside the inflation lethal zone
# before the user goal is re-sent (the global planner refuses to plan from lethal cells).
robot_radius: 0.55              # [m] must match costmap_common.yaml robot_radius
inflation_radius: 0.80          # [m] must match costmap_common.yaml inflation_radius
backup_extra_margin: 0.25       # [m] clearance beyond the inflation boundary

backup_min_clearance: 0.60      # [m] UNKNOWN-obstacle-only rear safety stop.
                                # Classified solids are excluded from this check.
                                # Must be > robot_radius (0.55 m).
backup_speed: 0.70              # [m/s] reverse speed during BACKING_UP state

backup_time: 5.0               # [s] fallback maximum backup duration.

# After backup completes, suppress SLOW_APPROACH for this many seconds so the
# robot can begin moving along the replanned path before obstacle detection
# resumes (avoids immediately re-entering SLOW_APPROACH near the marked solid).
post_backup_cooldown: 0.0       # [s]  solid_excl_radius + heading check prevent re-probing

# ── 3D point cloud processing ─────────────────────────────────────
# Applied to the raw lidar PointCloud2 (topic: point_cloud_in) after
# transforming to base_link frame.  Heights and ranges are in metres.
#
# ANYmal C base_link is ~0.55 m AGL at nominal stance.
# Box geometry (1.0 m tall, ground-level): in base_link z ∈ [-0.55, +0.45].
#   min_height = -0.30 captures 75% of the box while excluding the ground.
# Robot body self-returns: max ~0.47 m from base centre; range_min = 0.55 m
# excludes them with margin.
cloud_height_min: -0.10         # [m] base frame — exclude ground + low-angle ground rings
                                # −0.10 m = 0.45 m AGL; captures top 55% of 1 m boxes
                                # while eliminating Gazebo ground-plane ring artifacts
cloud_height_max:  1.20         # [m] base frame — include full 1 m box top
cloud_range_min:   0.55         # [m] exclude robot body self-returns
cloud_range_max:   8.0          # [m]
forward_sector_deg: 45.0        # [deg] half-angle of forward detection cone (±sector)

# Exclusion zone around confirmed solid obstacles.
# Once an obstacle is classified SOLID, cloud points within this radius are
# ignored when computing _nearest_obs — prevents SLOW_APPROACH from re-firing
# as the robot navigates around the confirmed obstacle on the replanned path.
solid_excl_radius: 0.7          # [m] ≥ box half-diagonal (0.35 m) + margin

# Exclusion zone around confirmed MOVABLE obstacle contact centers.
# Larger than solid_excl_radius because the obstacle drifts from its recorded
# position as the robot pushes through.  Points within this radius are dropped
# from _nearest_obs so the robot does not re-trigger SLOW_APPROACH.
# NOT used for costmap marking (movable obstacles are never written to the costmap).
movable_excl_radius: 1.5        # [m] contact_point ± expected push travel + margin

# Lidar-based movable obstacle tracking.
# Each cloud callback, for every confirmed movable obstacle outside the blind
# spot, the node searches for lidar returns within movable_track_radius of the
# stored center and updates the center to their centroid.  This keeps the
# exclusion zone centered on the obstacle's actual position as it gets pushed.
# movable_track_radius must be < (nearest solid obstacle distance / 2) to avoid
# stealing returns from unrelated objects.
movable_track_radius: 0.5       # [m] search radius around stored movable center
movable_track_min_pts: 3        # minimum lidar returns required to accept an update

# ── Safety (see contact_probe_robot.yaml for the hardware values) ────────────
# Inputs older than these halt the robot (HALTED: goals cancelled, speed 0,
# motion_allowed False; a new goal resumes once everything is healthy).
input_timeout:
  wrench: 0.3                  # [s]
  pose: 2.5                    # [s] >= 2.5x the /slam/pose period
  cloud: 1.0                   # [s]
require_health: true           # need nav_supervisor's /haptiquad_nav/health heartbeat
health_timeout: 0.5            # [s]
# |fx,fy| above collision_force_threshold_n for collision_hold_time outside
# CONTACT_PROBE/CLASSIFYING halts the robot (side/rear hits, obstacles the
# lidar missed). Bound is classification_force_threshold_n while pushing an
# object already classified MOVABLE; ignored for the first
# collision_backup_grace_s of BACKING_UP.
collision_stop_enabled: true
collision_force_threshold_n: 30.0   # [N] above the ~5-8N horizontal gait noise
collision_hold_time: 0.3            # [s]
collision_backup_grace_s: 1.5       # [s]
wrench_bias_calibration_s: 0.0      # [s] 0 = off (sim has no wrench bias)
wrench_filter_window_s: 0.0         # [s] 0 = use wrench_filter_window (samples)
max_wrench_bias_n: 40.0
cloud_height_reference: base        # base | gravity
self_filter_box: []                 # [x_min, x_max, y_min, y_max] base frame, [] = off
# Reset/override/injection services for haptiquad_nav_eval. Set by
# navigation.launch eval_mode:=true only.
eval_mode: false

