# contact_probe.yaml
# Parameters for the contact_probe_manager state machine node.

# ── Wrench thresholds ─────────────────────────────────────────────
# Forces in [N], torques in [Nm]
# Contact is confirmed solid if ANY component exceeds its threshold.
wrench_threshold:
  fx: 15.0          # forward force — primary contact signal
  fy: 10.0
  fz: 30.0          # vertical — usually terrain, be conservative
  tx: 3.0
  ty: 3.0
  tz: 2.0

# Averaging window for wrench (reduces noise spikes)
# ANYmal gait ≈ 2 Hz; wrench publishes at ~400 Hz → 200 samples ≈ one gait cycle.
# 50 samples gives ~125 ms smoothing — enough to suppress most gait oscillations
# without adding too much detection latency.
wrench_filter_window: 50        # samples

# ── Speed profiles ────────────────────────────────────────────────
normal_speed_fraction: 1.0      # fraction of max_vel_x in NORMAL_NAV
slow_approach_speed: 0.10       # [m/s] absolute, in SLOW_APPROACH state
probe_speed: 0.03               # [m/s] absolute, in CONTACT_PROBE state

# ── Distance triggers ─────────────────────────────────────────────
# Distance to perception obstacle (from /scan_obstacles) that triggers
# state transitions.
slow_approach_distance: 0.75    # [m] NORMAL_NAV → SLOW_APPROACH
                                # Kept slightly above probe_distance to give a brief deceleration
                                # ramp. Was 0.80 m = inflation_radius, which made the robot enter
                                # SLOW_APPROACH at the visible inflation boundary (looked premature).
probe_distance: 0.65            # [m] SLOW_APPROACH → CONTACT_PROBE
                                # MUST be > pc2scan range_min (0.55 m, robot body exclusion radius).
                                # Robot front ≈ 0.275 m ahead of base center → at probe_distance 0.65 m,
                                # the robot front is ~0.375 m from the obstacle surface when probing starts.
                                # At probe_speed 0.03 m/s this takes ~12.5 s, within probe_timeout (20 s).

# ── Map update ────────────────────────────────────────────────────
mark_radius: 0.2                # [m] radius around contact point to mark
costmap_update_service: /move_base/global_costmap/update_cost   # placeholder

# ── Timing ────────────────────────────────────────────────────────
probe_timeout: 20.0             # [s] max time in CONTACT_PROBE before giving up (no wrench)
                                # Robot front is ~0.375 m from obstacle when probing starts →
                                # ~12.5 s at 0.03 m/s just to reach contact; 20 s gives 7.5 s margin.
                                # Note: timeout is suspended once wrench exceeds threshold.
contact_hold_time: 1.0          # [s] wrench must exceed threshold for this long
                                # Increased from 0.5 s: gait oscillations can spike briefly above
                                # thresholds; 1.0 s ensures the signal is sustained (real contact)
classify_time: 2.5              # [s] forward push duration during classification
