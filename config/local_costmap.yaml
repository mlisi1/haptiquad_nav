# local_costmap.yaml
# The local planner's world: rolling window that DOES see
# perception obstacles, used for velocity scaling during approach.

global_frame: odom
rolling_window: true
width: 6.0                      # [m] rolling window size
height: 6.0
resolution: 0.05                # [m/cell]
update_frequency: 10.0          # Hz — matches controller_frequency
publish_frequency: 5.0
static_map: false
transform_tolerance: 0.5

# ── Layers ───────────────────────────────────────────────────────
# obstacle_layer IS present here — local planner sees perception obstacles.
plugins:
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
