# local_costmap.yaml
# The local planner's world: rolling window that DOES see
# perception obstacles, used for velocity scaling during approach.

global_frame: map
rolling_window: true
width: 6.0                      # [m] rolling window size
height: 6.0
resolution: 0.05                # [m/cell]
update_frequency: 10.0          # Hz — matches controller_frequency
publish_frequency: 5.0
static_map: false
transform_tolerance: 0.5

# ── Layers ───────────────────────────────────────────────────────
# NO obstacle_layer here. The contact_probe_manager reads /scan_obstacles
# directly for state transitions. If the local costmap also marks boxes as
# lethal, TrajectoryPlannerROS rejects all forward trajectories at full
# sim speed (0.4 m/s × 1.5 s = 0.6 m) and the robot never reaches
# contact — move_base triggers recovery before any probing can happen.
# The local costmap is intentionally all-free: the local planner always
# drives toward the goal; the contact_probe_manager gates the velocity.
plugins:
  - name: inflation_layer
    type: costmap_2d::InflationLayer
